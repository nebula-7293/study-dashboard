<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyPulse — Student Dashboard</title>
  
  <!-- Plus Jakarta Sans Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Modular Stylesheet -->
  <link rel="stylesheet" href="/css/styles.css?v=2.4">

  <!-- Immediate View Persistence Resolver (Runs synchronously before DOM renders) -->
  <script>
    (function() {
      try {
        var hash = window.location.hash ? window.location.hash.replace('#', '').trim() : '';
        var saved = localStorage.getItem('studypulse_active_view');
        var valid = { dashboard: 1, tasks: 1, schedule: 1, deadlines: 1, courses: 1, grades: 1 };
        var target = (hash && valid[hash]) ? hash : ((saved && valid[saved]) ? saved : 'dashboard');
        window.__INITIAL_VIEW__ = target;
        if (target && target !== 'dashboard' && window.location.hash !== '#' + target) {
          window.location.hash = target;
        }
      } catch (e) {
        window.__INITIAL_VIEW__ = 'dashboard';
      }
    })();
  </script>
</head>
<body>
  <div class="app-container">
    <!-- Desktop & Tablet Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-title">StudyPulse</span>
          <span class="brand-subtitle">Student Workspace</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Main Menu</div>
        <button class="nav-item active" data-view="dashboard">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/></svg>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-view="tasks">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>To-Do List</span>
        </button>
        <button class="nav-item" data-view="schedule">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Schedule</span>
        </button>
        <button class="nav-item" data-view="deadlines">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Deadlines</span>
        </button>

        <div class="nav-section-label" style="margin-top: 14px;">Academics</div>
        <button class="nav-item" data-view="courses">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span>Courses</span>
        </button>
        <button class="nav-item" data-view="grades">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <span>Grades & GPA</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-low);"></span>
          <span style="font-size: 0.75rem; font-weight: 600; color: var(--text-muted);">API Connected</span>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="main-wrapper">
      <!-- Sticky Topbar Header -->
      <header class="app-header">
        <div class="header-left">
          <h1 class="page-title" id="page-title">StudyPulse Dashboard</h1>
        </div>

        <div class="header-right">
          <!-- Global Scope Switcher -->
          <div class="scope-toggle-group">
            <button class="scope-pill active" data-scope="all">
              <span>All</span>
            </button>
            <button class="scope-pill" data-scope="uni">
              <span>Uni</span>
            </button>
            <button class="scope-pill" data-scope="personal">
              <span>Personal</span>
            </button>
          </div>

          <!-- Quick Add Button -->
          <button class="btn btn-primary btn-icon" id="btn-header-quick-add" title="Quick Add">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
      </header>

      <!-- Dynamic View Panes -->
      <main class="view-container">
        <!-- Dashboard Pane -->
        <section class="view-pane active" id="view-dashboard">
          <div id="dashboard-view-content"></div>
        </section>

        <!-- To-Do Tasks Pane -->
        <section class="view-pane" id="view-tasks">
          <div id="tasks-view-content"></div>
        </section>

        <!-- Schedule & Calendar Pane -->
        <section class="view-pane" id="view-schedule">
          <div id="schedule-view-content"></div>
        </section>

        <!-- Deadlines Pane -->
        <section class="view-pane" id="view-deadlines">
          <div id="deadlines-view-content"></div>
        </section>

        <!-- Courses Pane -->
        <section class="view-pane" id="view-courses">
          <div id="courses-view-content"></div>
        </section>

        <!-- Grades & Progress Pane -->
        <section class="view-pane" id="view-grades">
          <div id="grades-view-content"></div>
        </section>
      </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="bottom-nav-item active" data-view="dashboard">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/></svg>
        <span>Home</span>
      </button>
      <button class="bottom-nav-item" data-view="tasks">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span>To-Do</span>
      </button>
      <button class="bottom-nav-item" data-view="schedule">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Schedule</span>
      </button>
      <button class="bottom-nav-item" data-view="deadlines">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Deadlines</span>
      </button>
      <button class="bottom-nav-item" data-view="courses">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>Courses</span>
      </button>
      <button class="bottom-nav-item" data-view="grades">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        <span>GPA</span>
      </button>
    </nav>
  </div>

  <!-- Modals & Drawers Container -->

  <!-- Task Modal (Add / Edit) -->
  <div class="modal-backdrop" id="task-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="task-modal-title">Add New Task</h3>
        <button class="btn btn-ghost btn-icon-sm" id="btn-close-task-modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="task-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="task-title">Title *</label>
            <input type="text" id="task-title" name="title" class="form-control" placeholder="e.g. Finish Math problem set" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="task-desc">Description <span class="optional">Optional</span></label>
            <textarea id="task-desc" name="description" class="form-control" placeholder="Add extra notes or links..."></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="task-due-date">Due Date</label>
              <input type="date" id="task-due-date" name="due_date" class="form-control">
            </div>

            <div class="form-group">
              <label class="form-label" for="task-scope">Scope</label>
              <select id="task-scope" name="scope" class="form-control">
                <option value="uni">University</option>
                <option value="personal">Personal</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="task-urgency">Urgency Level</label>
            <select id="task-urgency" name="urgency" class="form-control">
              <option value="LOW">Low (Routine)</option>
              <option value="MEDIUM" selected>Medium (Important)</option>
              <option value="HIGH">High (Urgent / Emergency)</option>
            </select>
          </div>

          <!-- Smart Urgency Suggestion Box -->
          <div id="urgency-suggestion" class="urgency-suggestion-box"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-task">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-task">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Deadline Modal (Add / Edit) -->
  <div class="modal-backdrop" id="deadline-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="deadline-modal-title">Add New Deadline</h3>
        <button class="btn btn-ghost btn-icon-sm" id="btn-close-deadline-modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="deadline-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="deadline-title">Title *</label>
            <input type="text" id="deadline-title" name="title" class="form-control" placeholder="e.g. Final Project Submission" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="deadline-type">Type</label>
              <select id="deadline-type" name="type" class="form-control">
                <option value="assignment">Assignment</option>
                <option value="exam">Exam</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="deadline-course">Course</label>
              <select id="deadline-course" name="course_id" class="form-control">
                <!-- Injected dynamically -->
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="deadline-due-date">Due Date</label>
              <input type="date" id="deadline-due-date" name="due_date" class="form-control">
            </div>

            <div class="form-group">
              <label class="form-label" for="deadline-scope">Scope</label>
              <select id="deadline-scope" name="scope" class="form-control">
                <option value="uni">University</option>
                <option value="personal">Personal</option>
              </select>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-deadline">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-deadline">Save Deadline</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Course Modal (Add / Edit) -->
  <div class="modal-backdrop" id="course-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="course-modal-title">Add Course</h3>
        <button class="btn btn-ghost btn-icon-sm" id="btn-close-course-modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="course-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="course-title">Course Title *</label>
            <input type="text" id="course-title" name="title" class="form-control" placeholder="e.g. Software Architecture" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="course-code">Course Code</label>
              <input type="text" id="course-code" name="code" class="form-control" placeholder="e.g. CS301">
            </div>

            <div class="form-group">
              <label class="form-label" for="course-credits">Credits (ECTS)</label>
              <input type="number" id="course-credits" name="credits" class="form-control" step="0.5" min="0" placeholder="6.0">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="course-grade">Current Grade (%)</label>
              <input type="number" id="course-grade" name="current_grade" class="form-control" step="0.1" min="0" max="100" placeholder="e.g. 88.5">
            </div>

            <div class="form-group">
              <label class="form-label" for="course-scope">Scope</label>
              <select id="course-scope" name="scope" class="form-control">
                <option value="uni">University</option>
                <option value="personal">Personal</option>
              </select>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-course">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-course">Save Course</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Schedule Occasion Modal (Add / Edit) -->
  <div class="modal-backdrop" id="schedule-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="schedule-modal-title">Schedule Occasion</h3>
        <button class="btn btn-ghost btn-icon-sm" id="btn-close-schedule-modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="schedule-form">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="schedule-course">Course</label>
              <select id="schedule-course" name="course_id" class="form-control">
                <!-- Dynamically injected -->
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="schedule-type">Type</label>
              <select id="schedule-type" name="type" class="form-control">
                <option value="Lecture">Lecture</option>
                <option value="Lab">Lab</option>
                <option value="Work">Work</option>
                <option value="Miscellaneous">Miscellaneous</option>
                <option value="Seminar">Seminar</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="schedule-title">Name / Topic <span class="optional">Or uses Course Title</span></label>
            <input type="text" id="schedule-title" name="title" class="form-control" placeholder="e.g. Design Patterns Lecture">
          </div>

          <div class="form-row-3">
            <div class="form-group">
              <label class="form-label" for="schedule-day">Date</label>
              <input type="date" id="schedule-day" name="day" class="form-control" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="schedule-start">Start Time</label>
              <input type="time" id="schedule-start" name="start_time" class="form-control" value="09:00" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="schedule-end">End Time</label>
              <input type="time" id="schedule-end" name="end_time" class="form-control" value="10:30" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="schedule-repeat">Repeatable</label>
              <select id="schedule-repeat" name="repeat" class="form-control">
                <option value="None">None</option>
                <option value="Daily">Daily</option>
                <option value="Weekly">Weekly</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="schedule-repeat-until">Repeat Until <span class="optional">Optional</span></label>
              <input type="date" id="schedule-repeat-until" name="repeat_until" class="form-control">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="schedule-location">Location</label>
              <input type="text" id="schedule-location" name="location" class="form-control" placeholder="e.g. Auditorium 204 or Zoom">
            </div>

            <div class="form-group">
              <label class="form-label" for="schedule-scope">Scope</label>
              <select id="schedule-scope" name="scope" class="form-control">
                <option value="uni">University</option>
                <option value="personal">Personal</option>
              </select>
            </div>
          </div>

          <!-- Color Picker for Monthly Calendar Dots -->
          <div class="form-group">
            <label class="form-label">Calendar Dot Color</label>
            <div class="color-picker-group" id="occasion-color-picker"></div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-schedule">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-schedule">Save Occasion</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Pomodoro Settings Modal -->
  <div class="modal-backdrop" id="pomodoro-settings-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Pomodoro Interval Settings</h3>
        <button class="btn btn-ghost btn-icon-sm" id="btn-close-pomodoro-settings-modal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="pomodoro-settings-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="pomo-work">Focus Work Interval (minutes)</label>
            <input type="number" id="pomo-work" name="work" class="form-control" min="1" max="120" value="25" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="pomo-short">Short Break Interval (minutes)</label>
            <input type="number" id="pomo-short" name="shortBreak" class="form-control" min="1" max="60" value="5" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="pomo-long">Long Break Interval (minutes)</label>
            <input type="number" id="pomo-long" name="longBreak" class="form-control" min="1" max="60" value="15" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="btn-cancel-pomodoro-settings">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Intervals</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Day Agenda Slide-Over Drawer -->
  <div class="drawer-backdrop" id="day-agenda-drawer">
    <div class="drawer-container">
      <div class="drawer-header">
        <h3 class="modal-title" id="day-agenda-title">Day Agenda</h3>
        <button class="btn btn-ghost btn-icon-sm" id="btn-close-day-agenda">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="drawer-body" id="day-agenda-body"></div>
    </div>
  </div>

  <!-- Course Detail Slide-Over Drawer -->
  <div class="drawer-backdrop" id="course-detail-drawer">
    <div class="drawer-container">
      <div class="drawer-header">
        <h3 class="modal-title" id="course-detail-title">Course Overview</h3>
        <button class="btn btn-ghost btn-icon-sm" id="btn-close-course-detail">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
